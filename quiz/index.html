<script>
// The first quiz was retired on 2026-10-10. Old links to /quiz/ (YouTube descriptions, outreach, shared results)
// forward to the new one. The ?ref= tag goes along, or, without one, the site the visit came from,
// so GoatCounter still credits the link that brought them.
(function () {
  var q = location.search;
  try {
    var from = document.referrer ? new URL(document.referrer).hostname : '';
    if (from && from !== location.hostname && !/[?&](ref|utm_source|src)=/.test(q)) q += (q ? '&' : '?') + 'ref=' + encodeURIComponent(from);
  } catch (e) {}
  location.replace('/quiz/v2/' + q + location.hash);
})();
</script>
