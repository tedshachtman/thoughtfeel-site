<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#172e31">
<title>Explain Your Evidence · Phone remote</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="./remote.css">
</head><body>
<form id="pair" hidden>
  <div class="room-card">
    <p class="eyebrow">Phone remote</p>
    <h1>Connect to the board</h1>
    <p>Press C on the board to see its four-letter room code.</p>
    <label for="room">Room code</label>
    <input id="room" name="room" maxlength="4" minlength="4" pattern="[a-zA-Z]{4}" required autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
    <button>Connect</button>
  </div>
</form>
<main id="remote" hidden>
  <header>
    <div class="heading"><p id="position" class="eyebrow"></p><h1 id="name">Phone remote</h1></div>
    <div id="link" role="img" aria-label="Board disconnected" title="Board disconnected"></div>
    <button id="jump" class="quiet" aria-haspopup="dialog">Jump</button>
  </header>
  <aside id="banner" role="status">Connecting to board…</aside>
  <div id="content" tabindex="-1">
    <section id="scriptPanel"><p id="script"></p></section>
    <section id="timer" hidden>
      <div class="timer-row"><h2>Writing time</h2><output id="clock">6:00</output></div>
      <div class="timer-actions"><button id="toggleTimer">Start</button><button id="add">+1 min</button><button id="reset">Reset</button></div>
    </section>
    <section id="prompts" hidden><h2>Conferring prompts</h2><div id="promptCards"></div></section>
    <aside id="preview" hidden><span class="eyebrow">Up next</span><p id="upcoming"></p></aside>
  </div>
  <nav aria-label="Board controls"><button id="back"><span aria-hidden="true">←</span> Back</button><button id="next">Next <span aria-hidden="true">→</span></button></nav>
</main>
<dialog id="menu"><form method="dialog">
  <div class="dialog-heading"><h2>Jump to a moment</h2><button class="quiet" value="cancel">Close</button></div>
  <label for="slideSelect">Slide</label><select id="slideSelect"></select>
  <label for="stepSelect">Step</label><select id="stepSelect"></select>
  <button id="go" value="go">Show on board</button>
</form></dialog>
<script type="module" src="./remote.js"></script>
</body></html>
